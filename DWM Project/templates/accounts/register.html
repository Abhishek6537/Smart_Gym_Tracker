{% extends 'base.html' %}

{% block title %}Create Account{% endblock %}
{% block page_title %}Account Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-white text-center py-3">
                <i class="fa-solid fa-user-plus text-success fs-2 mb-2"></i>
                <h5 class="fw-bold mb-0">Register Account</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Register &amp; Sign In</button>
                </form>
                <div class="text-center mt-3 small text-muted">
                    Already have an account? <a href="/accounts/login/" class="text-primary">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
