{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}
{% block page_title %}Account Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-white text-center py-3">
                <i class="fa-solid fa-dumbbell text-primary fs-2 mb-2"></i>
                <h5 class="fw-bold mb-0">Sign in to FitPulse</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
                </form>
                <div class="text-center mt-3 small text-muted">
                    Don't have an account? <a href="/accounts/register/" class="text-primary">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
